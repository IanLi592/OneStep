name: onestep
description: "跬步 Onestep —— 简洁的间隔重复闪记卡应用（Android + Windows）。"
publish_to: 'none'

# 版本号格式: 主版本.次版本.修订-日期+构建号
# versionName=0.1.0-20261101(系统设置里可见、含日期可区分新旧包)
# versionCode=20261101(构建号,Android 要求单调递增,日期天然满足)
# 注意:每天构建时更新此日期(YYYYMMDD),便于区分装的是哪天的包。
version: 0.1.0-202611011122+1793503336

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地存储（SQLite）
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # 导入导出
  csv: ^6.0.0
  # APKG 是 zip 包；archive 用于解压读取
  archive: ^3.6.1

  # 同步客户端 HTTP
  http: ^1.2.2

  # APKG 导入需读取其中的 SQLite
  sqlite3: ^2.4.0

  # 读取应用版本号（设置页显示）
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.26.0
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
