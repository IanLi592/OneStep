org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 默认内置 Kotlin。必须显式设为 true:Flutter migrator 只在该标志
# "不存在"时才追加 =false;显式写 true 可阻止它改回 false。
# 若为 false,插件模块(如 package_info_plus 的 .kts)不会注册 Kotlin 编译任务,
# 导致 "找不到符号 PackageInfoPlugin" 构建失败。
android.builtInKotlin=true
# newDsl=false 为 Flutter 模板所需,保留。
android.newDsl=false
